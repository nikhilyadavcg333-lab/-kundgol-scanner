<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>PRO PLUS V41 GROUPED</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI,sans-serif}body{background:#060a0f;color:#d6e2ec;padding:8px}.hd{background:linear-gradient(90deg,#00ff88,#00d4ff,#7c4dff);color:#000;padding:14px;border-radius:14px;font-weight:900;display:flex;justify-content:space-between}.badge{background:#000;color:#00ff88;padding:5px 12px;border-radius:20px;font-size:12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:10px 0}.card{background:#0f1922;border:1px solid #1c2e3f;padding:10px;border-radius:10px;text-align:center}.card h3{font-size:10px;color:#7a93a8}.card b{font-size:16px}.ctrl{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.ctrl input,.ctrl select{background:#0f1922;border:1px solid #1c2e3f;color:#fff;padding:9px;border-radius:8px;font-size:13px}.tbl{background:#0f1922;border:1px solid #1c2e3f;border-radius:12px;overflow:hidden}.th{padding:10px 12px;font-weight:800;background:#0a141e;display:flex;justify-content:space-between;color:#00ff88;border-left:4px solid #00ff88}table{width:100%;border-collapse:collapse;font-size:11px}th{background:#071017;padding:7px 4px;color:#5f7a8e;font-size:9px;position:sticky;top:0}td{padding:10px 4px;border-bottom:1px solid #15212e}.sym{font-weight:800;color:#fff;font-size:13px}.up{color:#00ff88}.down{color:#ff4d6d}.score-high{background:#00ff88;color:#000;padding:4px 8px;border-radius:10px;font-weight:900;font-size:11px}.tag{font-size:9px;padding:4px 8px;border-radius:10px;font-weight:900}.buy-tag{background:#00ff88;color:#000}.real-tag{background:#ffcc00;color:#000;font-size:8px;padding:2px 4px;border-radius:3px;font-weight:900}.load{text-align:center;padding:30px;color:#4a667a}</style></head><body>
<div class="hd"><span>🔥 PRO PLUS V41 - GROUPED</span><span class="badge" id="badge">PRO LIVE</span></div>
<div class="grid"><div class="card"><h3>UNIQUE STOCKS</h3><b id="cAll">0</b></div><div class="card"><h3>PRO SCORE >70</h3><b id="cPro" style="color:#00ff88">0</b></div><div class="card"><h3>STRONG BUY</h3><b id="cBuy" style="color:#00ff88">0</b></div><div class="card"><h3>TOTAL ₹Cr</h3><b id="cBreak" style="color:#00d4ff">0</b></div></div>
<div class="ctrl"><input id="search" placeholder="🔍 Symbol..." style="flex:1"><select id="mode"><option value="pro">🔥 PRO PLUS: Score>70 + REAL BULK BUY</option><option value="real">✅ REAL BULK ONLY - GROUPED</option><option value="yalla">YALLA ALL</option></select><select id="sort"><option value="value">₹Cr High</option><option value="score">Score High</option><option value="deals">Deals High</option></select></div>
<div class="tbl"><div class="th"><span id="title">PRO PLUS GROUPED</span><span id="time" style="font-size:10px;color:#5a7488"></span></div>
<div style="max-height:82vh;overflow:auto"><table><thead><tr><th>#</th><th>SYMBOL</th><th>SPOT / 9:15H</th><th>% / SURGE</th><th>SCORE</th><th>CE / TGT / SL</th><th>PRO SIGNAL</th></tr></thead><tbody id="body"><tr><td colspan=7 class=load>Loading...</td></tr></tbody></table></div></div>
<script>
let ALL=[],FII=[];
async function load(){
 try{
  let fr=await fetch('/api/block-deals'); let fj=await fr.json(); FII=fj.data||[];
  try{let ar=await fetch('/api/all'); let aj=await ar.json(); ALL=aj.data||[];}catch(e){ALL=[]}
  render();
 }catch(e){}
}
function calcScore(s,f){let score=0; if(f){score+=30; if(f.type.includes('BUY')) score+=20; let v=parseFloat(f.value||0); if(v>=1) score+=20; else if(v>=0.2) score+=10;} score+= Math.min(20,(s.surge||1)*8); return Math.min(100,Math.round(score));}
function render(){
 let q=document.getElementById('search').value.toUpperCase();
 let mode=document.getElementById('mode').value;
 let sort=document.getElementById('sort').value;
 let raw=[];
 if(ALL.length>0){ raw=ALL.map(s=>{let f=FII.find(x=>x.symbol===s.symbol); return {...s,fii:f,valueCr:f?parseFloat(f.value):0,type:f?f.type:'',client:f?f.client:'',score:calcScore(s,f),high9:(s.open*1.01).toFixed(2)};}); }
 else { raw=FII.map((f,i)=>({symbol:f.symbol,spot:parseFloat(f.price)||0,pChange:0,surge:1.5,open:parseFloat(f.price)||0,fii:f,valueCr:parseFloat(f.value||f.val||0),type:f.type,client:f.client,score: f.type.includes('BUY')?75:40, high9:(parseFloat(f.price)*1.01).toFixed(2)})); }

 // V41 GROUPING - 1 SYMBOL = 1 ROW
 let map=new Map();
 raw.forEach(r=>{
  if(!map.has(r.symbol)){
    map.set(r.symbol,{...r,deals:1,totalCr:r.valueCr,clients:[r.client],buyCnt:r.type.includes('BUY')?1:0});
  }else{
    let g=map.get(r.symbol);
    g.deals+=1; g.totalCr+=r.valueCr; g.clients.push(r.client);
    if(r.type.includes('BUY')) g.buyCnt+=1;
    if(r.valueCr>g.valueCr) g.valueCr=r.valueCr;
    g.spot=Math.max(g.spot,r.spot);
    g.score=Math.max(g.score,r.score);
  }
 });
 let data=Array.from(map.values());
 if(q) data=data.filter(s=>s.symbol.includes(q));
 if(mode==='pro') data=data.filter(s=>s.score>=70 && s.buyCnt>0);
 let totalCr=data.reduce((a,b)=>a+b.totalCr,0);
 if(sort==='value') data.sort((a,b)=>b.totalCr-a.totalCr);
 if(sort==='score') data.sort((a,b)=>b.score-a.score);
 if(sort==='deals') data.sort((a,b)=>b.deals-a.deals);
 document.getElementById('cAll').innerText=data.length;
 document.getElementById('cPro').innerText=data.filter(s=>s.score>=70).length;
 document.getElementById('cBuy').innerText=data.filter(s=>s.buyCnt>0).length;
 document.getElementById('cBreak').innerText='₹'+totalCr.toFixed(0)+'Cr';
 document.getElementById('title').innerText=`GROUPED - ${data.length} unique stocks (from ${raw.length} deals)`;
 document.getElementById('time').innerText=new Date().toLocaleTimeString('en-IN');
 document.getElementById('badge').innerText=`LIVE • ${raw.length} DEALS → ${data.length} STOCKS`;
 if(!data.length){document.getElementById('body').innerHTML='<tr><td colspan=7 class=load>No signals</td></tr>';return;}
 let h=''; data.forEach((s,i)=>{
  let ce=Math.round(s.spot/50)*50; let tgt=Math.round(s.spot*1.03); let sl=Math.round(s.spot*0.985);
  let scCls='score-high';
  let sig=s.buyCnt>0?`<span class="tag buy-tag">🔥 STRONG BUY x${s.buyCnt}</span>`:`<span class="tag" style="background:#ff4d6d;color:#fff">SELL AVOID</span>`;
  let bulk=`<br><span class="real-tag">${s.deals} DEALS</span><small style="color:#8aa0b3"> ₹${s.totalCr.toFixed(2)}Cr Total • ${s.clients[0]?.substring(0,14)}</small>`;
  h+=`<tr><td>${i+1}</td><td class="sym">${s.symbol}<small style="display:block;color:#5a7488;font-size:9px">${s.deals} bulk</small></td><td>${s.spot.toFixed(2)}<br><small style="color:#5a7488">9:15H ${s.high9}</small></td><td>+0.00%<br>1.50x</td><td><span class="${scCls}">${s.score}</span></td><td>CE ${ce}<br><span class="up">TGT ${tgt}</span> / <span class="down">SL ${sl}</span></td><td>${sig}${bulk}</td></tr>`;
 }); document.getElementById('body').innerHTML=h;
}
document.getElementById('search').addEventListener('input',render);
document.getElementById('mode').addEventListener('change',render);
document.getElementById('sort').addEventListener('change',render);
load(); setInterval(load,90000);
</script></body></html>
