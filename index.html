<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kundgol FINAL - Entry + Exit</title>
<style>
body{font-family:Arial;background:#0f172a;color:white;padding:8px;margin:0}
h2{color:#22c55e;text-align:center;margin:5px}
table{width:100%;border-collapse:collapse;font-size:11px;background:#1e293b;border-radius:8px;overflow:hidden}
th{background:#0f172a;padding:8px;color:#94a3b8;position:sticky;top:0;font-size:10px}
td{padding:6px;border-bottom:1px solid #334155;text-align:center}
.green{background:#16a34a;color:white;padding:3px 6px;border-radius:6px;font-weight:bold;display:inline-block}
.red{background:#dc2626;color:white;padding:3px 6px;border-radius:6px;font-weight:bold;display:inline-block}
.gray{background:#475569;color:white;padding:3px 6px;border-radius:6px;display:inline-block}
.yellow{background:#f59e0b;color:white;padding:3px 6px;border-radius:6px;font-weight:bold;display:inline-block}
.live{background:#16a34a;animation:blink 1s infinite;font-weight:bold}
@keyframes blink{0%{opacity:1}50%{opacity:0.6}}
.time-badge{background:#334155;padding:1px 5px;border-radius:10px;font-size:9px}
</style>
</head>
<body>

<h2>🔥 KUNDGOL FINAL - ENTRY + EXIT + LIVE ✅</h2>
<p style="text-align:center;font-size:10px">1s Live | Trend | Correct Lot | Buyer Time | Profit | Auto Exit | 25k Check</p>

<table>
<thead>
<tr>
<th>Symbol</th>
<th>Buyer + Time</th>
<th>Buy ₹</th>
<th>Live Spot</th>
<th>Trend</th>
<th>Deals</th>
<th>Lot</th>
<th>Cost</th>
<th>Profit %</th>
<th>ENTRY</th>
<th>EXIT 🚪</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>

<script>
// ✅ 1. CORRECT LOT SIZE
const LOT_MAP = {"HAL":300,"ICICIBANK":700,"TCS":150,"INFY":400,"RELIANCE":250,"LICI":400,"SBIN":1500,"HDFCBANK":550,"ITC":1600,"BHEL":2625};

// ✅ 2. DATA
let dealsData = [
  {symbol:"HAL", buyer:"LIC", time:"09:32 AM", buyPrice:4510.25, deals:12, spot:4845.70, pChange:1.80, highest:4845.70},
  {symbol:"ICICIBANK", buyer:"HDFC MF", time:"10:15 AM", buyPrice:1330.50, deals:50, spot:1342.00, pChange:0.70, highest:1342},
  {symbol:"TCS", buyer:"SBI MF", time:"11:05 AM", buyPrice:4100.00, deals:22, spot:4045.25, pChange:-0.80, highest:4100},
  {symbol:"LICI", buyer:"FII", time:"09:45 AM", buyPrice:935.00, deals:2, spot:960.00, pChange:2.50, highest:965},
  {symbol:"RELIANCE", buyer:"LIC", time:"09:15 AM", buyPrice:2900.00, deals:30, spot:2950.00, pChange:1.20, highest:2950},
  {symbol:"SBIN", buyer:"HDFC MF", time:"10:30 AM", buyPrice:810.00, deals:8, spot:805.00, pChange:-0.60, highest:820},
];

function getTrend(p){
  p=parseFloat(p);
  if(p>1) return `<span style="color:#22c55e">🚀 FULL UP +${p}%</span>`;
  if(p>0.5) return `<span style="color:#22c55e">⬆️ UP +${p}%</span>`;
  if(p<-1) return `<span style="color:#ef4444">💥 FULL DOWN ${p}%</span>`;
  if(p<-0.5) return `<span style="color:#ef4444">⬇️ DOWN ${p}%</span>`;
  return `<span class="gray">➡️ SIDE ${p}%</span>`;
}

function getEntry(d){
  let lot=LOT_MAP[d.symbol]||500;
  if(d.deals<5) return `<span class="gray">❌ SKIP</span>`;
  let cost = d.pChange>0? 65*lot : 50*lot;
  let ok = cost<=25000? "✅" : "❌";
  if(d.pChange>0.5){
    let ce=Math.ceil(d.spot/10)*10;
    return `<span class="green">✅ ${ce} CE | ${ok}</span>`;
  } else if(d.pChange<-0.5){
    let pe=Math.floor(d.spot/10)*10;
    return `<span class="red">✅ ${pe} PE | ${ok}</span>`;
  } else return `<span class="gray">⏸️ WAIT</span>`;
}

// ✅ 3. EXIT LOGIC - MAIN
function getExit(d){
  let profit = ((d.spot - d.buyPrice)/d.buyPrice*100);
  
  // A. Target Hit +5%
  if(profit>=5) return `<span class="green">🎯 EXIT +${profit.toFixed(1)}% Target!</span>`;
  
  // B. Buyer Exit - Deals 12 -> 2 (Buyer selling)
  if(profit>2 && d.deals<=3) return `<span class="red">🚨 EXIT - Buyer Selling! Deals ${d.deals}</span>`;
  
  // C. Stoploss -2%
  if(profit<=-2) return `<span class="red">🛑 EXIT SL ${profit.toFixed(1)}%</span>`;
  
  // D. Trend Reversal
  if(d.pChange<-0.8 && profit>0) return `<span class="yellow">⚠️ EXIT - Trend Down</span>`;
  
  // E. Trailing SL - High ninda 35 rs kelage bandre exit
  let trailingSL = d.highest - 35;
  if(d.spot < trailingSL && profit>1) return `<span class="yellow">📉 EXIT Trail SL Hit ₹${trailingSL.toFixed(0)}</span>`;
  
  // F. Time Exit 3:15 PM
  let now=new Date();
  if(now.getHours()>=15 && now.getMinutes()>=15) return `<span class="gray">⏰ EXIT 3:15 Close</span>`;
  
  // HOLD
  return `<span style="color:#22c55e;font-weight:bold">💎 HOLD +${profit.toFixed(1)}% | SL:₹${trailingSL.toFixed(0)}</span>`;
}

function render(){
  let html="";
  dealsData.forEach(d=>{
    let lot=LOT_MAP[d.symbol]||500;
    let cost=d.pChange>0? 65*lot : 50*lot;
    let profit=((d.spot-d.buyPrice)/d.buyPrice*100).toFixed(2);
    let pColor=profit>0?"#22c55e":"#ef4444";
    
    // Update highest
    if(d.spot>d.highest) d.highest=d.spot;
    
    html+=`<tr>
      <td><b>${d.symbol}</b></td>
      <td><b>${d.buyer}</b><br><span class="time-badge">🕘 ${d.time}</span></td>
      <td>₹${d.buyPrice.toFixed(0)}</td>
      <td class="live">₹${d.spot.toFixed(2)}</td>
      <td>${getTrend(d.pChange)}</td>
      <td>${d.deals}</td>
      <td>${lot}</td>
      <td>₹${cost}</td>
      <td style="color:${pColor};font-weight:bold">${profit>0?'+':''}${profit}%</td>
      <td>${getEntry(d)}</td>
      <td>${getExit(d)}</td>
    </tr>`;
  });
  document.getElementById("tbody").innerHTML=html;
}

// 🔥 LIVE UPDATE 1 SEC
function updateLive(){
  dealsData=dealsData.map(d=>{
    let chg=(Math.random()-0.5)*4;
    d.spot+=chg;
    d.pChange=(parseFloat(d.pChange)+chg*0.01).toFixed(2);
    // Simulate buyer exit - deals kammi
    if(Math.random()>0.95 && d.deals>2) d.deals -=1;
    return d;
  });
  render();
}

render();
setInterval(updateLive, 1000);
</script>

</body>
</html>
