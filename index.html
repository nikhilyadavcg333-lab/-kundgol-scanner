<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kundgol V11 - All Base</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a1931;color:#fff;font-family:Inter,Arial;padding:12px}
.badge{padding:8px 14px;border-radius:8px;font-weight:700;font-size:13px;display:inline-block;margin:3px}
.bull{background:#00e676;color:#000} .bear{background:#ff5252} .neu{background:#455a64}
.rowTop{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
input,select{padding:12px;border-radius:10px;border:none;background:#132a4c;color:#fff;font-size:14px}
input{flex:1}
.btn{padding:10px 14px;border-radius:10px;border:none;font-weight:800;cursor:pointer;font-size:13px}
.bScan{background:#00e676} .bBear{background:#ffeb3b;color:#000} .bBull{background:#00e5ff;color:#000} .bPos{background:#ff6dff;color:#000} .bNews{background:#ff9100;color:#000} .bTrend{background:#7c4dff;color:#fff} .bOrder{background:#18ffff;color:#000}
.card{background:#11294f;border-radius:16px;padding:16px;margin-top:12px;border:1px solid #1e3a5f}
.title{font-size:17px;font-weight:800;margin-bottom:10px}
.stockRow{display:flex;justify-content:space-between;align-items:center;background:#0d1f3d;padding:12px;border-radius:10px;margin:8px 0;flex-wrap:wrap}
.tag{font-size:11px;padding:3px 7px;border-radius:6px;margin-left:6px;font-weight:700}
.tagNews{background:#ff9100;color:#000} .tagTrend{background:#7c4dff} .tagOrder{background:#18ffff;color:#000} .tagV{background:#ffd54f;color:#000}
</style>
</head>
<body>

<div id="indexTop">Loading...</div>

<div class="rowTop">
  <select id="poolSelect" onchange="changePool()">
    <option value="ALL">SELECT STOCK LIST - All</option>
    <option value="NIFTY50">Nifty 50</option>
    <option value="BANK">Bank + Financial</option>
    <option value="NEXT50">Next 50</option>
    <option value="MIDCAP">Midcap Select</option>
    <option value="FPI150">India FPI 150</option>
    <option value="FPI100">FPI 100</option>
    <option value="CUSTOM">Custom List</option>
  </select>
  <input id="stockInput" value="tcs, infy, reliance, sbin, hdfc, icici, bharti, midcap, tatamotors, fpi">
</div>

<div class="rowTop">
  <button class="btn bScan" onclick="scanAll()">SCAN NOW</button>
  <button class="btn bBear" onclick="showList('bear')">BEAR WINNERS</button>
  <button class="btn bBull" onclick="showList('bull')">BULL WINNERS</button>
  <button class="btn bPos" onclick="showList('positive')">POSITIVE WINNERS</button>
  <button class="btn bNews" onclick="showList('news')">NEWS BASE+</button>
  <button class="btn bTrend" onclick="showList('trend')">TREND BASE</button>
  <button class="btn bOrder" onclick="showList('order')">BIG ORDER BASE</button>
</div>

<div id="listContainer"></div>

<script>
let niftyChange = 0.27;
let stocksData = [];

const pools = {
  NIFTY50:['TCS','INFY','RELIANCE','HDFCBANK','ICICIBANK','SBIN','BHARTIARTL'],
  BANK:['HDFCBANK','ICICIBANK','SBIN','AXISBANK','KOTAKBANK'],
  NEXT50:['ADANIGREEN','ZOMATO','DMART','PIDILITE'],
  MIDCAP:['TATAMOTORS','MIDCAP','BHEL','PERSISTENT','MPHASIS'],
  FPI150:['TCS','INFY','TATAMOTORS','BHEL','POLYCAB','COFORGE'],
  FPI100:['TCS','INFY','RELIANCE'],
  ALL:['TCS','INFY','RELIANCE','SBIN','HDFCBANK','ICICIBANK','BHARTIARTL','TATAMOTORS','BHEL','COFORGE','POLYCAB','ADANIGREEN'],
  CUSTOM:[]
};

function changePool(){
  const p = document.getElementById('poolSelect').value;
  if(p!=='CUSTOM'){
    document.getElementById('stockInput').value = pools[p].join(', ');
  }
}

async function fetchIndex(){
  niftyChange = (Math.random()*1.2-0.3).toFixed(2);
  document.getElementById('indexTop').innerHTML = `
    <span class="badge ${niftyChange>=0?'bull':'bear'}">50 ${niftyChange}% ${niftyChange>=0?'↑ BULL':'↓ BEAR'}</span>
    <span class="badge bear">NEXT 50 -1.19% ↓ BEAR</span>
    <span class="badge bear">BANK -0.43% ↓ BEAR</span>
    <span class="badge neu">FINANCIAL -0.34% BEAR</span>
    <span class="badge bear">MIDCAP -0.89% BEAR</span>
    <span class="badge bull">FPI 150 0.13% BULL</span>
  `;
}

function mockScan(){
  const inputStocks = document.getElementById('stockInput').value.split(',').map(s=>s.trim().toUpperCase()).filter(Boolean);
  const base = (inputStocks.length?inputStocks:pools.ALL);
  stocksData = base.map((sym,i)=>{
    const ch = +( (Math.random()*4 -0.5).toFixed(2) );
    const rs = +(ch - niftyChange).toFixed(2);
    const v50 = 65 + Math.floor(Math.random()*20);
    const newsScore = Math.floor(Math.random()*100); // NEWS BASE+
    const trend = Math.random()>0.5?'BULL':'BEAR';
    const ema = Math.random()>0.4?'EMA BULL':'EMA BEAR';
    const orderBuy = 40 + Math.floor(Math.random()*40); // 40-80%
    const bigOrder = orderBuy>65?'BIG BUY':orderBuy<45?'BIG SELL':'NEUTRAL';
    return {sym, change:ch, rs, v50, newsScore, trend, ema, orderBuy, bigOrder, volume: (100+Math.random()*200).toFixed(0)+'%'}
  });
}

function showList(type){
  let list=[], title='', extra='';
  if(type==='bear'){
    list = stocksData.filter(s=>s.rs>0.4).sort((a,b)=>b.rs-a.rs).slice(0,5);
    title = `BEAR WINNERS Nifty ${niftyChange}% (${list.length}) - Same Strategy Base`;
  }else if(type==='bull'){
    list = stocksData.filter(s=>s.change> (parseFloat(niftyChange)+0.4) && s.v50>=68).sort((a,b)=>b.rs-a.rs).slice(0,5);
    title = `BULL WINNERS Nifty ${niftyChange}% (${list.length}) - Nifty beat`;
  }else if(type==='positive'){
    list = stocksData.filter(s=>s.change>=1.0).sort((a,b)=>b.change-a.change).slice(0,5);
    title = `POSITIVE WINNERS >1% (${list.length}) - Absolute Gainers`;
  }else if(type==='news'){
    list = stocksData.filter(s=>s.newsScore>70).sort((a,b)=>b.newsScore-a.newsScore).slice(0,5);
    title = `NEWS BASE+ (${list.length}) - News Score >70`;
    extra = 'news';
  }else if(type==='trend'){
    list = stocksData.filter(s=>s.trend==='BULL' && s.ema.includes('BULL')).sort((a,b)=>b.v50-a.v50).slice(0,5);
    title = `TREND BASE (${list.length}) - EMA + Supertrend BULL`;
    extra = 'trend';
  }else if(type==='order'){
    list = stocksData.filter(s=>s.orderBuy>=60).sort((a,b)=>b.orderBuy-a.orderBuy).slice(0,5);
    title = `BIG ORDER BASE (${list.length}) - Big Buyer 60%+`;
    extra = 'order';
  }

  document.getElementById('listContainer').innerHTML = `
    <div class="card">
      <div class="title">${title}</div>
      ${list.map(s=>`
        <div class="stockRow">
          <div>
            <b>${s.sym} | Change ${s.change}% | RS ${s.rs}% | V50 ${s.v50}%</b>
            ${type==='news'?`<span class="tag tagNews">NEWS ${s.newsScore}</span>`:''}
            ${type==='trend'?`<span class="tag tagTrend">${s.trend} ${s.ema}</span>`:''}
            ${type==='order'?`<span class="tag tagOrder">BUY ${s.orderBuy}% ${s.bigOrder} Vol ${s.volume}</span>`:''}
            <span class="tag tagV">V50 ${s.v50}%</span>
            <br><small style="color:#8aff8a">Nifty ${niftyChange}% vs ${s.sym} ${s.change}% = RS +${s.rs}% ${extra==='order'?`| OrderFlow BUY ${s.orderBuy}%`:''} ${extra==='news'?`| News: Results/FII Buy`:''}</small>
          </div>
          <button class="btn bScan" onclick="scanStock('${s.sym}')">SCAN</button>
        </div>
      `).join('') || '<small>No match - Pool change madi SCAN madi</small>'}
    </div>
  `;
}

function scanAll(){ fetchIndex(); mockScan(); showList('bull'); }
function scanStock(sym){ alert(sym+' Details:\nNEWS: FII Buy 200cr\nTREND: BULL Engulfing EMA 20>50\nORDER: BUY 67% Big Order 5cr\nCE Strike + TGT 2% SL 1%') }

fetchIndex(); mockScan(); showList('bull');
</script>
</body>
</html>
