<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<title>V50 ULTIMATE</title>
<style>body{background:#0a0f1c;color:#fff;font-family:Arial;padding:10px}
.top{display:flex;overflow-x:auto;gap:8px}
.card{min-width:110px;padding:10px;border-radius:10px;text-align:center;font-weight:700}
.bull{background:#00ff88;color:#000}.bear{background:#ff4444}
.box{background:#111827;padding:15px;border-radius:12px;margin-top:12px;border:1px solid #333}
input{padding:12px;width:60%;border-radius:8px;border:none;background:#1f2937;color:#fff}
button{padding:12px 18px;border-radius:8px;border:none;font-weight:700;cursor:pointer}
.scan{background:#00ff88}.bearwin{background:#ffd700}
.v50{font-size:42px;font-weight:900;color:#00ff88}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.btn{padding:12px;border-radius:8px;text-align:center;font-weight:700}
.ce{border:1px solid #00ff88}.tgt{border:1px solid #00ff88;color:#00ff88}.sl{border:1px solid #ff4444;color:#ff4444}
</style></head><body>
<div class="top" id="sectors"></div>
<div class="box">
 <input id="sym" placeholder="hdfc bank, sbi, reliance"><button class="scan" onclick="scan()">SCAN</button>
 <button class="bearwin" onclick="bear()">BEAR WINNERS 🏆</button>
 <div id="out" style="margin-top:15px"></div>
 <div id="bearout"></div>
</div>
<script>
async function loadSectors(){
 let r=await fetch('/api/sectors'); let d=await r.json();
 document.getElementById('sectors').innerHTML=d.sectors.map(s=>`<div class="card ${s.status=='BULL'?'bull':'bear'}">${s.name}<br>${s.change}%<br>${s.status=='BULL'?'↑ BULL':'↓ BEAR'}</div>`).join('');
}
async function scan(){
 let s=document.getElementById('sym').value||'SBIN';
 let r=await fetch('/api/v50/'+s); let d=await r.json();
 document.getElementById('out').innerHTML=`
  <div>${d.symbol} • NSE • EQ</div>
  <div>V50 Score</div><div class="v50">${d.v50}%</div>
  <div>LTP ₹${d.chart?.ltp||0} ${d.chart?.change||0}% • ${d.signal}</div>
  <div class="grid">
   <div>Trend<br><b>${d.chart?.trend||''}</b></div>
   <div>Order Flow<br><b>BUY ${d.flow?.buy||0}% • ${d.flow?.status||''}</b></div>
   <div>Candle<br><b>${d.chart?.candle||''}</b></div>
   <div>Source<br><b>${d.chart?.source||''}</b></div>
  </div>
  <div class="grid" style="margin-top:15px">
   <div class="btn ce">CE<br>${d.ce}</div>
   <div class="btn tgt">TGT<br>${d.tgt}</div>
   <div class="btn sl">SL<br>${d.sl}</div>
   <div class="btn ce" style="background:#00ff88;color:#000" onclick="alert('Order Placed ${d.symbol} ${d.ce}')">PLACE ORDER</div>
  </div>
  <div style="margin-top:10px;font-size:12px;color:#aaa">PCR: ${d.option?.pcr||1} • ${d.option?.trend||''} • Flow: ${d.flow?.source||''}<br>News: ${(d.news||[]).map(n=>n.title).join(' | ')}</div>
 `;
}
async function bear(){
 let r=await fetch('/api/bear-winners'); let d=await r.json();
 document.getElementById('bearout').innerHTML=`<h3>BEAR WINNERS Nifty ${d.niftyChange}% (${d.count})</h3>`+d.winners.map(w=>`<div style="background:#111827;padding:8px;margin:5px;border-radius:8px">🏆 ${w.symbol} | Change ${w.stockChange}% | RS +${w.rs}% | V50 ${w.v50}%<br><small>${w.reason}</small> <button onclick="document.getElementById('sym').value='${w.symbol}';scan()">SCAN</button></div>`).join('');
}
loadSectors(); setInterval(loadSectors,60000);
</script></body></html>
