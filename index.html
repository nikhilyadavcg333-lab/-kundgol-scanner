<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NIKHIL YADAV - F3+ OI+ LIVE TRACKER V17 REAL</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#0f172a;color:white;padding:10px}
.header{text-align:center;padding:15px;background:linear-gradient(90deg,#1e3a8a,#3b82f6);border-radius:10px;margin-bottom:10px}
.header h1{font-size:22px} .header p{font-size:12px;opacity:0.8}
.controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:15px 0}
.btn{padding:10px 18px;border:none;border-radius:20px;font-weight:bold;cursor:pointer;color:white}
.fii{background:#16a34a} .dii{background:#2563eb} .sell{background:#dc2626} .all{background:#475569}
.live{color:#22c55e;font-weight:bold;text-align:center;margin:10px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.card{border-radius:12px;padding:15px;position:relative;overflow:hidden}
.card.buy{background:linear-gradient(135deg,#052e16,#16a34a)} .card.sell{background:linear-gradient(135deg,#450a0a,#dc2626)}
.sym{font-size:18px;font-weight:bold} .price{font-size:20px;font-weight:bold;margin:5px 0}
.badge{display:inline-block;padding:3px 8px;border-radius:10px;font-size:11px;background:rgba(0,0,0,0.3);margin:2px}
.vol{position:absolute;top:10px;right:10px;background:yellow;color:black;padding:4px 8px;border-radius:10px;font-weight:bold;font-size:12px}
</style>
</head>
<body>
<div class="header">
<h1>NIKHIL YADAV - F3+ OI+ LIVE TRACKER V17 REAL NSE</h1>
<p>KUNDGOL SCANNER - REAL PRICE - GOOGLE MATCHED</p>
</div>
<div class="live" id="liveTime">Loading Real Prices...</div>
<div class="controls">
<button class="btn fii" onclick="filterData('buy')">FII BUY (<span id="fiiCount">0</span>)</button>
<button class="btn dii" onclick="filterData('dii')">DII BUY (<span id="diiCount">0</span>)</button>
<button class="btn sell" onclick="filterData('sell')">SELL (<span id="sellCount">0</span>)</button>
<button class="btn all" onclick="filterData('all')">ALL 70 (<span id="allCount">0</span>)</button>
</div>
<div class="grid" id="grid"></div>

<script>
let allStocks=[]; let currentFilter='all';
function getStatus(s){
  if(s.pChange > 1.5) return {type:'buy', label:'FII BUYING NOW'};
  if(s.pChange > 0.5) return {type:'buy', label:'DII BUYING NOW'};
  if(s.pChange < -0.5) return {type:'sell', label:'SELLING NOW'};
  return {type:'buy', label:'LIVE PICK'};
}
async function load(){
  let res = await fetch('/api/all');
  let json = await res.json();
  allStocks = json.data;
  document.getElementById('liveTime').innerText = '🔴 LIVE: '+json.time+' | TOTAL: '+json.total+' | REAL NSE PRICE';
  updateCounts();
  render();
}
function updateCounts(){
  let fii = allStocks.filter(s=>s.pChange>1.5).length;
  let dii = allStocks.filter(s=>s.pChange>0.5 && s.pChange<=1.5).length;
  let sell = allStocks.filter(s=>s.pChange< -0.5).length;
  document.getElementById('fiiCount').innerText=fii;
  document.getElementById('diiCount').innerText=dii;
  document.getElementById('sellCount').innerText=sell;
  document.getElementById('allCount').innerText=allStocks.length;
}
function filterData(type){ currentFilter=type; render(); }
function render(){
  let grid=document.getElementById('grid');
  let filtered = allStocks;
  if(currentFilter=='buy') filtered = allStocks.filter(s=>s.pChange>1.5);
  else if(currentFilter=='dii') filtered = allStocks.filter(s=>s.pChange>0.5 && s.pChange<=1.5);
  else if(currentFilter=='sell') filtered = allStocks.filter(s=>s.pChange< -0.5);
  
  grid.innerHTML = filtered.map(s=>{
    let st = getStatus(s);
    return `<div class="card ${st.type}">
      <div class="vol">${s.surge}x VOL</div>
      <div class="sym">${s.symbol}</div>
      <div class="badge">${st.label}</div>
      <div class="price">₹${s.spot} <span style="font-size:14px;color:#bbf7d0">(${s.pChange>0?'+':''}${s.pChange}%)</span></div>
      <div class="badge">Prev: ₹${s.prevClose}</div>
      <div class="badge">LIVE NSE</div>
      <div style="margin-top:8px;font-size:12px">${st.type=='buy'?'CE BUY @ '+(Math.round(s.spot/10)*10):'PE BUY @ '+(Math.round(s.spot/10)*10)}</div>
    </div>`;
  }).join('');
}
load();
setInterval(load, 10000);
</script>
</body>
</html>
