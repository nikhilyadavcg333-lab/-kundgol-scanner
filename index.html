<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>V6 PRO - Final</title>
<style>
body{margin:0;background:#050505;color:#fff;font-family:Arial;padding:10px}
h1{text-align:center;color:#00ff88;margin:5px;font-size:22px}
.bar{background:#111;border:1px solid #00ff88;padding:8px;border-radius:8px;text-align:center;font-size:11px;color:#00ff88;margin:8px 0}
.top{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
button{padding:12px 16px;border:0;border-radius:8px;font-weight:bold;cursor:pointer}
#scan{background:#00ff88;color:#000}
.badge{background:#111;border:1px solid #333;padding:6px 12px;border-radius:20px;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;margin-top:12px}
.card{background:#151515;border:2px solid #222;border-radius:12px;padding:14px}
.card.top{border-color:gold;box-shadow:0 0 15px rgba(255,215,0,0.3)}
.price{font-size:26px;font-weight:bold;margin:8px 0}
.tag{font-size:11px;padding:4px 8px;border-radius:12px;background:#222;display:inline-block;margin:3px}
.tag.bull{background:#00ff88;color:#000}
.tag.gold{background:gold;color:#000}
.copy{width:100%;background:#00d9ff;color:#000;margin-top:10px;padding:12px;border-radius:8px;font-weight:bold;font-size:14px}
.small{font-size:11px;color:#aaa;margin:4px 0}
</style>
</head>
<body>
<h1>⚡ V6 PRO - FINAL FIXED</h1>
<div class="bar">✅ 9 Logic Active | Min 3.5Cr | FII Only | Premium | Nifty100 | Top FII | CE Trade | Highest First | Error Fixed</div>
<div class="top">
<button id="scan" onclick="loadData()">🔍 SCAN NOW</button>
<div class="badge" id="tm">Last: --</div>
<div class="badge">V6.2 Final</div>
</div>
<div id="box" class="grid">Loading...</div>
<script>
async function loadData(){
 let btn=document.getElementById('scan');
 btn.innerText='⏳ Scanning...';
 try{
  let res=await fetch('/live-prices');
  let data=await res.json();
  document.getElementById('tm').innerText='Last: '+data.time;
  let box=document.getElementById('box');
  box.innerHTML='';
  if(!data.blocks || data.blocks.length===0){
    box.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:40px;color:#888;">No Blocks<br>Sunday Closed - Monday 8:45 Live</div>';
    btn.innerText='🔍 SCAN NOW'; return;
  }
  data.blocks.forEach(function(b){
    let ce=Math.ceil(b.price/50)*50;
    let copyText=b.symbol+' '+ce+' CE BUY @ Market - Block '+b.valueCr+'Cr';
    let card=document.createElement('div');
    card.className='card '+(b.isTopFII?'top':'');
    card.innerHTML='<div style="display:flex;justify-content:space-between;"><h3 style="margin:0;">'+b.symbol+'</h3><span class="tag '+(b.isTopFII?'gold':'bull')+'">'+(b.isTopFII?'TOP FII '+b.ratio+'X':'FII '+b.ratio+'X')+'</span></div><div class="price">₹'+b.price+' <span style="font-size:13px;color:#00ff88;">+'+b.premium+'% Premium 🟢</span></div><div class="tag">💰 ₹'+b.valueCr+'Cr ('+b.qty.toLocaleString()+' x ₹'+b.price+')</div><div class="tag">⏰ '+b.time+'.'+b.ms+'</div><div class="small">Buyer: '+b.buyer+'</div><div class="small" style="color:gold;">'+b.reason+'</div><div class="tag bull">CE: '+ce+' CE</div><button class="copy" onclick="navigator.clipboard.writeText(\''+copyText+'\');this.innerText=\'✅ Copied!\';setTimeout(()=>{this.innerText=\'📋 COPY TRADE - '+b.symbol+' '+ce+' CE\'},1500)">📋 COPY TRADE - '+b.symbol+' '+ce+' CE</button>';
    box.appendChild(card);
  });
 }catch(e){
  document.getElementById('box').innerHTML='<div style="color:#ff4444;text-align:center;padding:20px;">Error: '+e.message+'<br>node server.js restart madi</div>';
 }
 btn.innerText='🔍 SCAN NOW';
}
loadData();
setInterval(loadData,10000);
</script>
</body>
</html>
