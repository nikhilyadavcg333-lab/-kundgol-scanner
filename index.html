<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KUNDGOL V16 MIDCAP</title>
<style>
body{background:#0a0a0a;color:#fff;font-family:Arial;padding:10px;margin:0}
.head{background:linear-gradient(90deg,#00ff88,#00aaff);padding:15px;border-radius:12px;color:#000;text-align:center}
.statbox{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.stat{background:#1a1a1a;padding:12px;border-radius:8px;text-align:center;border:1px solid #333}
.stat b{font-size:20px;display:block}
.fil{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.fil button{padding:8px 12px;border-radius:20px;background:#222;color:#fff;border:1px solid #444}
.fil button.on{background:#00ff88;color:#000;font-weight:bold}
.card{padding:10px;border-radius:10px;margin:8px 0;border-left:5px solid}
.g{background:#0f1f15;border-color:#00ff88}
.r{background:#1f0f0f;border-color:#ff4444}
</style>
</head>
<body>
<div class="head"><h2 style="margin:0">🔥 KUNDGOL V16 LARGE+MIDCAP</h2><div id="src">Loading...</div></div>
<div class="statbox">
<div class="stat">Total<b id="tot">0</b></div>
<div class="stat">PREM CE<b id="pre">0</b></div>
<div class="stat">DISC PE<b id="dis">0</b></div>
</div>
<div class="fil">
<button id="cALL" class="on" onclick="setC('ALL')">ALL 50</button>
<button id="cLARGE" onclick="setC('LARGE')">LARGE CAP</button>
<button id="cMIDCAP" onclick="setC('MIDCAP')">MIDCAP NIFTY</button>
</div>
<div class="fil">
<button id="tALL" class="on" onclick="setT('ALL')">ALL</button>
<button id="tPREM" onclick="setT('PREM')">PREM CE +2%</button>
<button id="tDISC" onclick="setT('DISC')">DISC PE</button>
<button onclick="scanNow()" style="background:#00aaff">SCAN NOW</button>
</div>
<div id="cards">Loading...</div>
<script>
const LARGE=["ICICIBANK","HDFCBANK","INFY","TCS","RELIANCE","SBIN","BHARTIARTL","LT","ITC","AXISBANK","KOTAKBANK","BAJFINANCE","MARUTI","WIPRO","HCLTECH","SUNPHARMA","TITAN","ULTRACEMCO","PERSISTENT","COFORGE","HAL","BEL","TRENT"];
let DATA=[];let curC='ALL';let curT='ALL';
function setC(c){curC=c;document.querySelectorAll('[id^=c]').forEach(b=>b.classList.remove('on'));document.getElementById('c'+c).classList.add('on');show();}
function setT(t){curT=t;document.querySelectorAll('[id^=t]').forEach(b=>b.classList.remove('on'));document.getElementById('t'+t).classList.add('on');show();}
function show(){
let f=DATA;
if(curC=='LARGE')f=f.filter(x=>LARGE.includes(x.symbol));
if(curC=='MIDCAP')f=f.filter(x=>!LARGE.includes(x.symbol));
if(curT=='PREM')f=f.filter(x=>!x.isDisc);
if(curT=='DISC')f=f.filter(x=>x.isDisc);
document.getElementById('tot').innerText=f.length;
document.getElementById('pre').innerText=f.filter(x=>!x.isDisc).length;
document.getElementById('dis').innerText=f.filter(x=>x.isDisc).length;
document.getElementById('cards').innerHTML=f.map(b=>`
<div class="card ${b.isDisc?'r':'g'}">
<div style="display:flex;justify-content:space-between"><b>${b.symbol} - ${b.strike} ${b.cat}</b><b>${b.perc}%</b></div>
Spot:${b.close} -> LTP:${b.ltp} (${b.perc}%)<br>
Strike:${b.strike} ${b.isDisc?'PE':'CE'} | Lot:${b.lot} | Exp:16 OCT<br>
Buyer:${b.buyer} ${b.real?'REAL':'SIM'}<br>
Time:${b.Time}<br>
<b>${b.strike} ${b.isDisc?'PE':'CE'} BUY</b>
</div>`).join('')||'<p style="text-align:center">No data</p>';
}
async function load(){let r=await fetch('/api/blocks');let d=await r.json();DATA=d.blocks;document.getElementById('src').innerText=d.source+' | '+d.scanTime+' | Total:'+d.total;show();}
async function scanNow(){document.getElementById('cards').innerHTML='Scanning NSE...';let r=await fetch('/api/scan');let d=await r.json();DATA=d.blocks;document.getElementById('src').innerText=d.source+' | '+d.scanTime;show();}
load();
</script>
</body>
</html>
