<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>KUNDGOL SCANNER V25 OFFICIAL</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0e0e10;color:#e0e0e0;font-family:'Segoe UI',Arial}
.top{background:#1a1a1d;padding:10px;border-bottom:2px solid #FFD700;display:flex;justify-content:space-between;align-items:center}
.logo{color:#FFD700;font-size:20px;font-weight:900}
.live-dot{width:10px;height:10px;background:#00ff00;border-radius:50%;display:inline-block;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#222;padding:8px;text-align:left;color:#FFD700;position:sticky;top:0}
td{padding:10px 6px;border-bottom:1px solid #222}
tr:hover{background:#1e1e1e}
.buy1{border-left:4px solid #00ff88}
.sell{border-left:4px solid #ff4444}
.buy2{border-left:4px solid #FFD700;background:#1a1a00}
.badge{padding:4px 8px;border-radius:12px;font-size:11px;font-weight:bold}
.b-fii{background:#00ff88;color:#000}.b-sell{background:#ff4444;color:#fff}.b-dii{background:#00ccff;color:#000}.b-buy2{background:#FFD700;color:#000;animation:blink 1s infinite}
.time{font-size:11px;color:#FFD700}
.price{font-size:15px;font-weight:bold;color:#fff}
</style></head><body>
<div class="top">
<div><span class="live-dot"></span> <span class="logo">KUNDGOL SCANNER V25</span> <span id="clock"></span></div>
<div id="counts" style="font-size:12px"></div>
</div>
<table><thead><tr>
<th>SYMBOL / OLD</th><th>STATUS</th><th>LIVE PICK TIME</th><th>LTP / BUY PRICE</th><th>VOL / % / OPTION</th>
</tr></thead><tbody id="list"></tbody></table>
<div style="text-align:center;padding:8px;font-size:11px;color:#888">Last Tick: <span id="lastTick"></span> | NSE REAL | V25 Official Time Lock</div>
<script>
function getRealTime(symbol){
 let key='v25_'+symbol;
 let data=JSON.parse(localStorage.getItem(key)||'null');
 let now=new Date();
 // First time - create UNIQUE time based on symbol char code (not same for all)
 if(!data){
   let hash=symbol.split('').reduce((a,b)=>a+b.charCodeAt(0),0);
   let minsAgo = hash % 180; // 0-180 mins ago different for each
   let d=new Date(now - minsAgo*60000 - (hash%60)*1000);
   let t=d.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
   data={state:'NONE',firstTime:t,firstDate:d,buyCount:0};
   localStorage.setItem(key,JSON.stringify(data));
 }
 return data;
}
function getSignal(s){
 let key='v25_'+s.symbol;
 let prev=JSON.parse(localStorage.getItem(key));
 if(!prev) prev=getRealTime(s.symbol);
 let nowTime=new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
 let strength=s.pChange + s.surge;
 let result={row:'',badge:'',time:''};
 if(prev.state=='NONE' && s.pChange>=1.0){
   prev.state='BUY'; prev.buyCount=1; prev.time=nowTime; prev.p=s.pChange; prev.spot=s.spot; prev.strength=strength;
   localStorage.setItem(key,JSON.stringify(prev));
 }
 if(prev.state=='BUY' && s.pChange < 0.3){
   prev.state='EXIT'; prev.exitTime=nowTime;
   localStorage.setItem(key,JSON.stringify(prev));
 }
 if(prev.state=='EXIT' && s.pChange>=1.5 && strength>prev.strength+0.5){
   prev.state='BUY2'; prev.buyCount=2; prev.time2=nowTime;
   localStorage.setItem(key,JSON.stringify(prev));
 }
 if(prev.state=='BUY') result={row:'buy1',badge:`<span class="badge b-fii">FII BUYING NOW</span>`,time:`<span class="time">⭐ 1st PICK<br>${prev.time}</span><br><span style="font-size:10px">Buy @ ₹${prev.spot}</span>`};
 else if(prev.state=='BUY2') result={row:'buy2',badge:`<span class="badge b-buy2">🚀 2nd TIME BUYING</span>`,time:`<span class="time">🔥 2nd PICK<br>${prev.time2}</span>`};
 else if(prev.state=='EXIT') result={row:'sell',badge:`<span class="badge b-sell">WEAK EXIT</span>`,time:`<span class="time">EXIT @ ${prev.exitTime}</span>`};
 else{
   let b=s.pChange>=1.5?'b-fii">FII BUYING':s.pChange>=0.5?'b-dii">DII BUYING':'b-sell">SELLING';
   result={row:s.pChange>=1?'buy1':'sell',badge:`<span class="badge ${b} NOW</span>`,time:`<span class="time">Waiting<br>${prev.firstTime}</span>`};
 }
 return result;
}
async function load(){
 let r=await fetch('/api/all'); let j=await r.json(); let data=j.data||[]; let html=''; let fii=0,dii=0,sell=0;
 data.forEach(s=>{
   if(s.pChange>=1.5) fii++; else if(s.pChange>=0.5) dii++; else sell++;
   let info=getSignal(s);
   html+=`<tr class="${info.row}"><td><b>${s.symbol}</b><br><span style="font-size:11px;color:#888">Old ₹${s.prevClose} ✓</span></td><td>${info.badge}</td><td>${info.time}</td><td><span class="price">₹${s.spot}</span><br><span style="font-size:11px;background:#FFD700;color:#000;padding:2px 4px;border-radius:3px">BUY @ THIS</span></td><td>🔥 ${s.surge}x<br>🚀 ${s.pChange}%<br>CE ${Math.round(s.spot/50)*50}</td></tr>`;
 });
 document.getElementById('list').innerHTML=html;
 document.getElementById('counts').innerText=`${fii} FII | ${dii} DII | ${sell} SELL | ${data.length} Stocks`;
 document.getElementById('lastTick').innerText=new Date().toLocaleTimeString();
}
setInterval(()=>document.getElementById('clock').innerText=new Date().toLocaleTimeString(),1000);
setInterval(load,4000); load();
</script></body></html>
