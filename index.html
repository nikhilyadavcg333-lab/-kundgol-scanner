<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nikhil Yadav - FII BUY + STOP Tracker V12.1</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f172a;color:#fff;font-family:Arial;padding:10px}
h2{color:#22c55e;font-size:18px;text-align:center;padding:10px}
.sub{color:#facc15;text-align:center;font-size:12px;margin-bottom:8px}
#liveStatus{text-align:center;font-size:14px;font-weight:bold;padding:12px;border-radius:8px;margin:8px}
.liveBG{background:#facc15;color:#000}
.stopBG{background:#ef4444;color:#fff}
.waitBG{background:#334155;color:#fff}
table{width:100%;border-collapse:collapse;background:#1e293b;border-radius:8px;overflow:hidden;margin-top:10px}
th{background:#0f172a;padding:12px 4px;font-size:11px;color:#facc15;text-align:center}
td{padding:12px 4px;text-align:center;border-top:1px solid #334155;font-size:12px}
.buying{background:#1a2e05}
.stopped{background:#3f1010}
.ceLive{background:#22c55e;color:#000;padding:6px 8px;border-radius:6px;font-weight:bold;font-size:11px}
.ceStop{background:#ef4444;color:#fff;padding:6px 8px;border-radius:6px;font-weight:bold;font-size:11px}
.livePrice{color:#facc15;font-weight:bold;font-size:14px}
.stopPrice{color:#ef4444;font-weight:bold;font-size:14px}
</style>
</head>
<body>
<h2>🔥 NIKHIL YADAV - FII BUY + STOP TRACKER V12.1</h2>
<div class="sub">Yava Price Ge Buy Maadtavre + Stop Maadidaga Stop Buying</div>
<div id="liveStatus" class="waitBG">🟢 Scanning LIVE...</div>
<table>
<thead>
<tr><th>SYMBOL</th><th>STATUS + TIME</th><th>BUYING / STOP PRICE</th><th>VOL / TREND</th><th>SIGNAL</th></tr>
</thead>
<tbody id="tbody"></tbody>
</table>

<script>
// COMPLETE JAVASCRIPT CODE - BUYING + STOP LOGIC
let dealsData = [];
let lastStatus = {};
let stopHistory = {};

function render(){
 let tb = document.getElementById("tbody");
 tb.innerHTML = "";
 let allToShow = [];

 dealsData.forEach(d=>{
   let isBuying = d.surge >= 1.8 && d.pChange > 0.3;
   let wasBuying = lastStatus[d.symbol] === true;

   if(isBuying){
     allToShow.push({...d, state:"BUYING"});
     lastStatus[d.symbol] = true;
   } else if(wasBuying &&!isBuying){
     stopHistory[d.symbol] = {price: d.spot, time: d.time, surge: d.surge, buy: d.buy};
     lastStatus[d.symbol] = false;
     allToShow.push({...d, state:"STOPPED", stopPrice: stopHistory[d.symbol].price, stopTime: stopHistory[d.symbol].time});
   } else if(stopHistory[d.symbol] &&!isBuying){
     allToShow.push({...d, state:"STOPPED", stopPrice: stopHistory[d.symbol].price, stopTime: stopHistory[d.symbol].time, buy: stopHistory[d.symbol].buy});
   }
 });

 allToShow.sort((a,b)=>{
   if(a.state==="BUYING" && b.state==="STOPPED") return -1;
   if(a.state==="STOPPED" && b.state==="BUYING") return 1;
   return b.surge - a.surge;
 });

 if(allToShow.length === 0){
   tb.innerHTML = `<tr><td colspan=5 style="padding:40px;color:#94a3b8;font-size:14px">⏳ Eega Yavdu FII Buy Maadta Illa...<br>Surge >1.8x Aadaga Auto Barutte<br>5 Sec Auto Refresh...</td></tr>`;
   return;
 }

 allToShow.forEach(d=>{
  let tr = document.createElement("tr");
  if(d.state === "BUYING"){
    tr.className = "buying";
    tr.innerHTML = `<td><b style="font-size:14px">${d.symbol}</b><br><span style="font-size:10px;color:#94a3b8">Old Buy ₹${d.buy}</span></td>
    <td><span style="background:#22c55e;color:#000;padding:5px 10px;border-radius:12px;font-weight:bold;font-size:11px">🔥 BUYING NOW</span><br><span style="font-size:10px;color:#facc15">${d.time}</span></td>
    <td><span class="livePrice">₹${d.spot.toFixed(2)}</span><br><span style="font-size:10px;background:#facc15;color:#000;padding:3px 6px;border-radius:4px">BUYING @ THIS PRICE</span></td>
    <td style="color:#22c55e"><b>🔥 ${d.surge.toFixed(2)}x</b><br><span style="font-size:11px">🚀 ${d.pChange.toFixed(2)}%</span></td>
    <td><span class="ceLive">BUY ${Math.ceil(d.spot/10)*10} CE</span><br><span style="font-size:10px">Entry ₹${d.spot.toFixed(2)}</span></td>`;
  } else {
    tr.className = "stopped";
    let stopP = d.stopPrice || d.spot;
    let stopT = d.stopTime || d.time;
    tr.innerHTML = `<td><b style="font-size:14px">${d.symbol}</b><br><span style="font-size:10px;color:#94a3b8">Old Buy ₹${d.buy||d.buy}</span></td>
    <td><span style="background:#ef4444;color:#fff;padding:5px 10px;border-radius:12px;font-weight:bold;font-size:11px">🛑 STOP BUYING</span><br><span style="font-size:10px;color:#fca5a5">Stopped: ${stopT}</span></td>
    <td><span class="stopPrice">₹${stopP.toFixed(2)}</span><br><span style="font-size:10px;background:#ef4444;color:#fff;padding:3px 6px;border-radius:4px">STOPPED @ THIS</span></td>
    <td style="color:#ef4444"><b>📉 ${d.surge.toFixed(2)}x</b><br><span style="font-size:11px">Vol Down</span></td>
    <td><span class="ceStop">EXIT / BOOK</span><br><span style="font-size:10px">Book Profit</span></td>`;
  }
  tb.appendChild(tr);
 });
}

async function fetchLivePrices(){
 let statusEl = document.getElementById("liveStatus");
 try{
  let res = await fetch(`/api/all?t=${Date.now()}`, {cache:"no-store"});
  let json = await res.json();
  let now = new Date().toLocaleTimeString("en-IN", {timeZone:"Asia/Kolkata", hour:"2-digit", minute:"2-digit", second:"2-digit"});
  if(json.data && json.data.length>0){
   dealsData = json.data.map(l=>({
     symbol:l.symbol,
     buy:l.buy,
     spot:l.spot,
     pChange:l.pChange,
     surge:l.surge,
     time:now,
     volume:l.volume
   }));
   let buyingCount = dealsData.filter(d=> d.surge>=1.8 && d.pChange>0.3).length;
   let stoppedCount = Object.keys(stopHistory).filter(k=> lastStatus[k]===false).length;
   if(buyingCount>0){
     statusEl.className = "liveBG";
     statusEl.innerHTML = `🔥 LIVE ${now} IST | ${buyingCount} BUYING NOW @ PRICE SHOWN | ${stoppedCount} STOPPED`;
   } else if(stoppedCount>0){
     statusEl.className = "stopBG";
     statusEl.innerHTML = `🛑 LIVE ${now} IST | 0 BUYING | ${stoppedCount} JUST STOPPED @ PRICE - BOOK PROFIT`;
   } else {
     statusEl.className = "waitBG";
     statusEl.innerHTML = `⏳ LIVE ${now} IST | Scanning ${json.data.length} Stocks - No Buying Yet`;
   }
   render();
  }
 }catch(e){
   statusEl.innerHTML = "🟡 Retrying Connection...";
   statusEl.className = "waitBG";
 }
}

setInterval(fetchLivePrices, 5000);
fetchLivePrices();
setInterval(()=>{ stopHistory={}; lastStatus={}; }, 30*60*1000);
</script>
</body>
</html>
