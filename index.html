<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FII BUY SELL Separate</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:Arial;padding:8px}
.header{background:#111;padding:12px;border-radius:10px;text-align:center;border:1px solid #222;margin-bottom:10px}
.live{color:#00ff00;animation:blink 1s infinite} @keyframes blink{50%{opacity:0.3}}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.col{background:#111;border-radius:10px;padding:8px;border:1px solid #222}
.col-buy{border-top:3px solid #00ff88}
.col-sell{border-top:3px solid #ff3333}
.title{font-weight:bold;padding:8px;text-align:center;border-radius:6px;margin-bottom:8px;font-size:15px}
.t-buy{background:#00ff8822;color:#00ff88}
.t-sell{background:#ff333322;color:#ff5555}
.item{background:#1c1c1c;margin:5px 0;padding:8px 10px;border-radius:6px;display:flex;justify-content:space-between;font-size:13px}
.item b{color:#fff}
.b-price{color:#00ff88;font-weight:bold}
.s-price{color:#ff5555;font-weight:bold}
.old{color:#888;font-size:11px}
.badge{font-size:10px;padding:2px 5px;border-radius:4px}
.bg{background:#00ff8820;color:#00ff88}
.bs{background:#ff333320;color:#ff5555}
.allbox{margin-top:10px;background:#111;border-radius:10px;padding:10px;border:1px solid #222}
.allgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="header">
<b>NIKHIL YADAV TRACKER <span class="live">● LIVE</span></b> <span id="t" style="color:#888;font-size:12px;margin-left:10px"></span>
<div style="font-size:11px;color:#666;margin-top:4px">70 Stocks Live Price | Auto 10s</div>
</div>

<div class="grid">
<div class="col col-buy">
<div class="title t-buy" id="bt">🔥 BUYING STOCKS (0)</div>
<div id="bl">Loading...</div>
</div>
<div class="col col-sell">
<div class="title t-sell" id="st">🛑 SELLING STOCKS (0)</div>
<div id="sl">Loading...</div>
</div>
</div>

<div class="allbox">
<div style="font-weight:bold;margin-bottom:8px;text-align:center">📊 ALL 70 STOCKS LIVE PRICE</div>
<div class="allgrid" id="all">Loading 70...</div>
</div>

<script>
async function load(){
 let r=await fetch('/api/all',{cache:'no-store'});
 let j=await r.json();
 let d=j.data||[];
 document.getElementById('t').innerText=j.time;
 
 let buy = d.filter(x=> x.pChange > 0).sort((a,b)=> b.pChange - a.pChange);
 let sell = d.filter(x=> x.pChange < 0).sort((a,b)=> a.pChange - b.pChange);
 
 document.getElementById('bt').innerText=`🔥 BUYING STOCKS (${buy.length}) - SEPARATE`;
 document.getElementById('st').innerText=`🛑 SELLING STOCKS (${sell.length}) - SEPARATE`;
 
 document.getElementById('bl').innerHTML=buy.map(s=>`
  <div class="item">
   <div><b>${s.symbol}</b><br><span class="old">Old ₹${s.buy.toFixed(1)}</span></div>
   <div style="text-align:right"><span class="b-price">₹${s.spot.toFixed(2)}</span><br><span class="badge bg">+${s.pChange.toFixed(2)}% BUY</span></div>
  </div>`).join('') || '<div style="color:#555;text-align:center;padding:20px">No Buying</div>';
 
 document.getElementById('sl').innerHTML=sell.map(s=>`
  <div class="item">
   <div><b>${s.symbol}</b><br><span class="old">Old ₹${s.buy.toFixed(1)}</span></div>
   <div style="text-align:right"><span class="s-price">₹${s.spot.toFixed(2)}</span><br><span class="badge bs">${s.pChange.toFixed(2)}% SELL</span></div>
  </div>`).join('') || '<div style="color:#555;text-align:center;padding:20px">No Selling</div>';
 
 document.getElementById('all').innerHTML=d.map(s=>`
  <div style="background:#1a1a1a;padding:6px;border-radius:5px;font-size:12px;display:flex;justify-content:space-between">
   <b>${s.symbol}</b><span style="color:${s.pChange>0?'#00ff88':'#ff5555'}">₹${s.spot.toFixed(1)} ${s.pChange>0?'▲':'▼'}${Math.abs(s.pChange).toFixed(1)}%</span>
  </div>`).join('');
}
load(); setInterval(load,10000);
</script>
</body>
</html>
