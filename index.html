<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>KUNDGOL SCANNER V24 PRO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Arial;font-weight:bold}
.header{background:#FFD700;color:#000;padding:8px;text-align:center;font-size:16px;position:sticky;top:0;z-index:10}
.row{display:flex;align-items:center;justify-content:space-between;padding:12px 8px;border-bottom:1px solid #333;margin:2px 0}
.row.buy1{background:linear-gradient(90deg,#0a3d0a,#0f6b0f)}
.row.exit{background:linear-gradient(90deg,#3d0a0a,#6b0f0f)}
.row.buy2{background:linear-gradient(90deg,#3d3d0a,#6b6b0f);border:2px solid #FFD700;animation:goldblink 1s infinite}
@keyframes goldblink{50%{border-color:#fff}}
.sym{width:20%;font-size:16px}.old{font-size:11px;color:#90EE90}
.mid{width:36%;text-align:center}
.fii{padding:6px 10px;border-radius:20px;font-size:12px;display:inline-block}
.fii.buy1{background:#00ccff;color:#000}
.fii.exit{background:#ff4444;color:#fff}
.fii.buy2{background:#FFD700;color:#000}
.live{color:#FFD700;font-size:11px;margin-top:4px;line-height:13px}
.price{width:28%;text-align:center}
.ltp{font-size:19px}
.buy{background:#FFD700;color:#000;padding:4px;font-size:10px;border-radius:4px;margin-top:3px}
.vol{width:14%;text-align:right;font-size:12px;line-height:14px}
.tick{font-size:10px;color:#aaa;text-align:center;padding:6px;background:#111;position:sticky;bottom:0}
</style>
</head>
<body>
<div class="header">🔴 LIVE: <span id="clock"></span> | <span id="counts"></span><br>REAL NSE ₹ | V24 Time+Strength</div>
<div id="list">Loading 70 REAL STOCKS...</div>
<div class="tick">Last Tick: <span id="lastTick"></span> | Market 9:15-3:30 | Weak=EXIT | Strong=2nd BUY</div>

<script>
function getSignal(s){
  let key='v24_'+s.symbol;
  let prev=JSON.parse(localStorage.getItem(key)||'{"p":0,"strength":0,"state":"NONE","buyCount":0}');
  let strength = s.pChange + (s.surge*0.6);
  let nowTime=new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  
  // 1st BUY
  if(prev.state=='NONE' && s.pChange>=1.5){
    prev={p:s.pChange,strength:strength,state:'BUY',buyCount:1,time:nowTime,spot:s.spot};
    localStorage.setItem(key,JSON.stringify(prev));
  }
  // WEAK -> EXIT
  else if(prev.state=='BUY' && s.pChange < 0.5){
    prev.state='EXIT'; prev.exitTime=nowTime; prev.exitP=s.pChange;
    localStorage.setItem(key,JSON.stringify(prev));
  }
  // STRONG AGAIN -> 2nd TIME BUYING
  else if(prev.state=='EXIT' && s.pChange>=1.5 && strength > (prev.strength+0.5)){
    prev.state='BUY2'; prev.buyCount=2; prev.time2=nowTime; prev.p=s.pChange; prev.strength=strength;
    localStorage.setItem(key,JSON.stringify(prev));
  }

  if(prev.state=='BUY') return {row:'buy1', badge:'🔥 FII BUYING NOW', live:`⭐ LIVE PICK 1st BUY<br>${prev.time}<br>Buy @ ₹${prev.spot}`};
  if(prev.state=='BUY2') return {row:'buy2', badge:'🚀 2nd TIME FII BUYING', live:`🔥 SECOND TIME BUYING<br>${prev.time2}<br>Strong ${s.pChange}%`};
  if(prev.state=='EXIT') return {row:'exit', badge:'⚠️ WEAK - EXIT SIGNAL', live:`🔻 EXIT @ ${prev.exitTime}<br>${prev.p}% → ${s.pChange}%<br>Weak`};
  return {row:'buy1', badge: s.pChange>=1.5?'🔥 FII BUYING NOW':s.pChange>=0.5?'💎 DII BUYING NOW':'🔻 SELLING NOW', live:`WAITING...<br>${nowTime}`};
}

async function load(){
  try{
  let r=await fetch('/api/all'); let j=await r.json();
  let data=j.data||[]; let fii=0,dii=0,sell=0; let html='';
  data.forEach(s=>{
    if(s.pChange>=1.5) fii++; else if(s.pChange>=0.5) dii++; else sell++;
    let info=getSignal(s);
    html+=`<div class="row ${info.row}">
      <div class="sym">${s.symbol}<div class="old">Old ₹${s.prevClose} ✓</div></div>
      <div class="mid"><div class="fii ${info.row}">${info.badge}</div><div class="live">${info.live}</div></div>
      <div class="price"><div class="ltp">₹${s.spot}</div><div class="buy">BUYING @ THIS PRICE</div></div>
      <div class="vol">🔥 ${s.surge}x<br>🚀 ${s.pChange}%<br>CE ${Math.round(s.spot/50)*50+50}</div>
    </div>`;
  });
  document.getElementById('list').innerHTML=html || 'Wait...';
  document.getElementById('counts').innerText=`${fii} FII | ${dii} DII | ${sell} SELL | ${data.length} Stocks`;
  document.getElementById('lastTick').innerText=new Date().toLocaleTimeString();
  }catch(e){console.log(e)}
}
setInterval(()=>{document.getElementById('clock').innerText=new Date().toLocaleTimeString();},1000);
setInterval(load,3000);
load();
if(new Date().getHours()==9 && new Date().getMinutes()<25){ localStorage.clear(); }
</script>
</body>
</html>
